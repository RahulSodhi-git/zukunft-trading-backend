name: Customer platform safety tests
on:
  push:
    branches: [main, customer-worker-integration]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --check src/server.js
      - run: node src/test-binance-cooldown.js
      - run: node src/test-credential-settings.js
      - run: node src/test-worker-platform.js
